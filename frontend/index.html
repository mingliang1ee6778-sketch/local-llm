<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Java Card Local LLM Agent</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1d2430;
      --muted: #657083;
      --line: #d9dee8;
      --accent: #176d75;
      --accent-dark: #0f555c;
      --source: #eef5f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 24px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .chat {
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 18px;
    }

    .message {
      max-width: 860px;
      margin: 0 0 18px;
      white-space: pre-wrap;
    }

    .message.user {
      margin-left: auto;
      background: #e8efff;
      border: 1px solid #cfdbfb;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .message.assistant {
      background: #fff;
      border-left: 4px solid var(--accent);
      padding: 4px 0 4px 12px;
    }

    .sources {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .source {
      background: var(--source);
      border: 1px solid #d5e7ea;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      color: #2a4850;
      white-space: normal;
    }

    form {
      display: grid;
      grid-template-columns: 140px 90px 1fr auto;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }

    select,
    input,
    button {
      height: 42px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
    }

    select,
    input {
      min-width: 0;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }

    button {
      padding: 0 18px;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100vw - 20px, 1040px);
        padding: 12px 0;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      form {
        grid-template-columns: 1fr 88px;
      }

      input {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Java Card Local LLM Agent</h1>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form id="form">
      <select id="mode" aria-label="Mode">
        <option value="applet">applet</option>
        <option value="cos">cos</option>
        <option value="usim">usim</option>
      </select>
      <select id="topK" aria-label="Top K">
        <option value="3" selected>top 3</option>
        <option value="5">top 5</option>
        <option value="8">top 8</option>
      </select>
      <input id="query" autocomplete="off" placeholder="Ask about the PBOC applet code..." />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#form");
    const query = document.querySelector("#query");
    const mode = document.querySelector("#mode");
    const topK = document.querySelector("#topK");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");

    addAssistant("本地 PBOC applet 源码问答已就绪。可以问：APDU 处理是怎么分发到 PSE、PPSE 和普通 PBOC 实例的？");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = query.value.trim();
      if (!text) return;
      query.value = "";
      addUser(text);
      setBusy(true);
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            mode: mode.value,
            query: text,
            top_k: Number(topK.value)
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        addAssistant(data.answer, data.sources || []);
      } catch (error) {
        addAssistant(`Request failed: ${error.message}`);
      } finally {
        setBusy(false);
      }
    });

    function setBusy(value) {
      send.disabled = value;
      status.textContent = value ? "Thinking..." : "Ready";
    }

    function addUser(text) {
      const node = document.createElement("div");
      node.className = "message user";
      node.textContent = text;
      chat.appendChild(node);
      scrollToBottom();
    }

    function addAssistant(text, sources = []) {
      const node = document.createElement("div");
      node.className = "message assistant";
      const answer = document.createElement("div");
      answer.textContent = text;
      node.appendChild(answer);
      if (sources.length) {
        const sourceList = document.createElement("div");
        sourceList.className = "sources";
        sources.forEach((source, index) => {
          const item = document.createElement("div");
          item.className = "source";
          const metadata = source.metadata || {};
          const name = metadata.source || "unknown source";
          const score = typeof source.score === "number" ? ` score ${source.score.toFixed(3)}` : "";
          item.textContent = `${index + 1}. ${name}${score}`;
          sourceList.appendChild(item);
        });
        node.appendChild(sourceList);
      }
      chat.appendChild(node);
      scrollToBottom();
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
